spring.application.name=consulta-publica

server.port=8081

# Clave secreta de reCAPTCHA. No se versiona: llega por variable de entorno.
recaptcha.secret=${RECAPTCHA_SECRET:}

# Conexión de solo lectura a la base del monolito.
# La contraseña tampoco se versiona.
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/oficina_agua_db
spring.datasource.username=consulta_lector
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.read-only=true
